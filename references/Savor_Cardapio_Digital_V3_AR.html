<style>
/* =========================================================
   TOKENS (troque por restaurante)
   ========================================================= */
:root {
  --brand-dark: #5C3F2B;
  --cream: #F7F2EA;
  --cream-deep: #EFE7DB;
  --olive: #3E4A2B;
  --olive-hover: #334020;
  --accent: #D4623B;
  --accent-hover: #B94F2A;
  --text: #1F1A17;
  --muted: #7A6F66;
  --white: #FFFFFF;
  --badge: #E8553A;
  --cta-circle: #2A1E16;
  --line: #DCD3C7;

  --font-display: 'Playfair Display', Georgia, serif;
  --font-body: 'Poppins', system-ui, -apple-system, sans-serif;

  --r-sheet: 28px;
  --r-card: 16px;
  --r-img: 12px;
  --shadow: 0 4px 12px rgba(0,0,0,0.08);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

/* =========================================================
   BASE
   ========================================================= */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font-body);
  color: var(--text);
  background: #4A3323;
  -webkit-font-smoothing: antialiased;
}
button, a { font: inherit; color: inherit; text-decoration: none; border: none; background: none; cursor: pointer; }
img { display: block; width: 100%; height: 100%; object-fit: cover; }
.lucide { width: 20px; height: 20px; stroke-width: 1.8; }
::-webkit-scrollbar { display: none; }
* { scrollbar-width: none; }

/* Container do app: tela única, centralizada em telas grandes */
#app {
  position: relative;
  width: 100%;
  max-width: none;
  height: 100dvh;
  margin: 0 auto;
  background: var(--cream);
  overflow: hidden;
}
@media (min-width: 500px) {
  body { padding: 0; }
  #app { height: 100dvh; border-radius: 0; box-shadow: none; }
}

/* Views: uma por rota, empilhadas, com transição */
.view {
  position: absolute; inset: 0;
  overflow-y: auto;
  background: var(--cream);
  animation: viewIn .35s cubic-bezier(.2,.7,.2,1);
}
@keyframes viewIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: none; }
}

/* Placeholder (splash) */
.img-box { position: relative; overflow: hidden; background: linear-gradient(135deg, #8B6B52, #3B2A1E); }
.img-box img { position: absolute; inset: 0; }
.img-box.img-missing img { display: none; }
.img-box.img-missing::after {
  content: attr(data-label);
  position: absolute; inset: 0; display: grid; place-items: center;
  padding: 8px; text-align: center;
  font-size: 40px;
}

/* Tipografia */
.eyebrow { font-size: 10px; letter-spacing: .15em; text-transform: uppercase; line-height: 1.5; }
.serif { font-family: var(--font-display); font-weight: 500; }

/* Botões base */
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--white); color: var(--text);
  box-shadow: var(--shadow);
  display: grid; place-items: center; position: relative;
  transition: transform .15s ease;
  flex-shrink: 0;
}
.icon-btn:active { transform: scale(.96); }
.dot-badge {
  position: absolute; top: 2px; right: 2px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--badge); border: 1.5px solid var(--white);
}
.count-badge {
  position: absolute; top: -4px; right: -4px;
  min-width: 18px; height: 18px; padding: 0 4px; border-radius: 999px;
  background: var(--badge); color: var(--white);
  font-size: 10px; font-weight: 600; border: 1.5px solid var(--white);
  display: grid; place-items: center;
}
.count-badge.zero { display: none; }

/* =========================================================
   HOME
   ========================================================= */
.home { color: var(--white); background: var(--brand-dark); display: block; overflow-y:auto; overscroll-behavior-y:contain; }
.hero { position: relative; isolation:isolate; min-height: clamp(470px, 67dvh, 750px); overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: calc(122px + var(--safe-top)) 20px 76px; }
.home .hero-bg { position: absolute; inset: 0; z-index:-2; }
.home .hero-bg img { object-position: center 40%; }
.home .hero-shade {
  position: absolute; inset: 0; z-index: 1;
  background: linear-gradient(180deg, rgba(30,20,15,.25) 0%, rgba(30,20,15,.85) 100%);
}
.home-top {
  position: absolute; top: calc(24px + var(--safe-top)); left: 20px; right: 20px;
  display: flex; justify-content: space-between; align-items: flex-start; z-index: 2;
}
.logo { font-family: var(--font-display); font-weight: 500; font-size: 28px; }
.home-top .eyebrow { margin-top: 6px; color: rgba(255,255,255,.85); }
.top-actions { display: flex; gap: 12px; align-items: center; }
.avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--white); }
.home .icon-btn { width: 40px; height: 40px; }

.hero-text { position: relative; z-index: 2; }
.hero-title { font-family: var(--font-display); font-weight: 500; font-size: 40px; line-height: 1.1; }
.hero-text p { margin-top: 16px; max-width: 260px; font-size: 13px; line-height: 1.5; color: rgba(255,255,255,.9); }

.cta {
  margin-top: 24px; height: 48px; width: 200px; padding: 0 6px 0 20px;
  border-radius: 999px; background: var(--accent); color: var(--white);
  font-size: 14px; font-weight: 600;
  display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 8px 20px rgba(212,98,59,.35);
  transition: transform .15s ease, background .2s ease;
}
.cta:hover { background: var(--accent-hover); }
.cta:active { transform: scale(.97); }
.cta-arrow {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--cta-circle); display: grid; place-items: center;
}
.cta-arrow .lucide { width: 16px; height: 16px; }

.sheet {
  position: relative; margin-top: -30px; z-index: 3; min-height: 280px;
  background: var(--cream); color: var(--text);
  border-radius: var(--r-sheet) var(--r-sheet) 0 0;
  padding: 10px 20px calc(20px + var(--safe-bottom));
  overflow-y: auto;
}
.sheet-handle { width: 36px; height: 4px; border-radius: 4px; background: #CFC6BA; margin: 0 auto 16px; }

.quick-actions { display: grid; grid-template-columns: repeat(4, 1fr); justify-items: center; gap: 8px; }
.action-tile { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 11px; }
.action-circle {
  width: 48px; height: 48px; border-radius: 50%;
  background: var(--white); box-shadow: var(--shadow);
  display: grid; place-items: center; transition: transform .15s ease;
}
.action-tile:active .action-circle { transform: scale(.96); }
.action-tile.active .action-circle { background: var(--olive); color: var(--white); }

.info-cards { margin-top: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.info-card {
  position: relative; display: flex; flex-direction: column; text-align: left;
  background: var(--white); border-radius: var(--r-card); box-shadow: var(--shadow);
  padding: 8px 8px 12px; transition: transform .15s ease;
}
.info-card:active { transform: scale(.98); }
.info-card .thumb { height: 60px; border-radius: var(--r-img); overflow: hidden; margin-bottom: 10px; }
.info-card h3 { font-size: 14px; font-weight: 600; padding: 0 4px; }
.info-card p { font-size: 11px; color: var(--muted); line-height: 1.4; padding: 2px 36px 0 4px; min-height: 30px; }
.go-btn {
  position: absolute; right: 10px; bottom: 10px;
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--cream-deep); display: grid; place-items: center;
}
.go-btn .lucide { width: 14px; height: 14px; }

/* =========================================================
   CARDÁPIO
   ========================================================= */
.menu-header {
  position: relative; z-index: 0; isolation: isolate; height: 250px; color: var(--white);
  background: var(--brand-dark); overflow: hidden;
}
.menu-header .img-box { position: absolute; inset: 0; }
.menu-header .shade {
  position: absolute; inset: 0; z-index: 1;
  background: linear-gradient(180deg, rgba(30,20,15,.42) 0%, rgba(30,20,15,.62) 50%, rgba(30,20,15,.9) 100%);
  pointer-events:none;
}
.menu-top {
  position: absolute; top: calc(16px + var(--safe-top)); left: 16px; right: 16px;
  display: flex; justify-content: space-between; z-index: 2;
}
.menu-headline { position: absolute; left: 20px; bottom: 44px; z-index: 2; }
.menu-headline .eyebrow { color: rgba(255,255,255,.85); }
.menu-headline h1 { font-family: var(--font-display); font-weight: 500; font-size: 36px; margin-top: 8px; }

.menu-body {
  position: relative; z-index: 2; margin-top: -28px; background: var(--cream);
  border-radius: var(--r-sheet) var(--r-sheet) 0 0;
  padding: 24px 20px calc(28px + var(--safe-bottom)); min-height: 60%;
  box-shadow: 0 -4px 16px rgba(30,20,15,.04);
}
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px 20px; padding: 0 20px; }
.chip {
  flex-shrink: 0; height: 36px; padding: 0 18px; border-radius: 999px;
  background: var(--cream-deep); color: var(--text); font-size: 13px;
  transition: background .25s ease, color .25s ease, transform .15s ease;
}
.chip:active { transform: scale(.97); }
.chip.active { background: var(--olive); color: var(--white); font-weight: 600; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.card {
  position: relative; aspect-ratio: .85; border-radius: var(--r-card); overflow: hidden;
  color: var(--white); cursor: pointer;
  transition: transform .2s ease, opacity .25s ease;
  animation: viewIn .4s ease both;
}
.card:active { transform: scale(.98); }
.card.hidden { display: none; }
.card .img-box { position: absolute; inset: 0; }
.card::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 40%; z-index: 1;
  background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,.75) 100%);
}
.card-info { position: absolute; left: 12px; right: 52px; bottom: 12px; z-index: 2; }
.card-info h3 {
  font-size: 13px; font-weight: 600; line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.card-info p { font-size: 12px; opacity: .85; margin-top: 2px; }
.card-add {
  position: absolute; right: 10px; bottom: 10px; z-index: 2;
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--white); color: var(--text); display: grid; place-items: center;
  transition: transform .15s ease;
}
.card-add:active { transform: scale(.9); }
.card-add .lucide { width: 14px; height: 14px; }

/* =========================================================
   DETALHE DO PRODUTO
   ========================================================= */
.detail-hero {
  position: relative; height: clamp(300px, 42vh, 460px); overflow: hidden;
  border-radius: 0 0 var(--r-sheet) var(--r-sheet);
}
.detail-hero .img-box { position: absolute; inset: 0; }
.float-top {
  position: absolute; top: calc(16px + var(--safe-top)); left: 16px; right: 16px;
  display: flex; justify-content: space-between; z-index: 3;
}
.dots { position: absolute; left: 0; right: 0; bottom: 12px; display: flex; justify-content: center; gap: 6px; z-index: 2; }
.dots span,.dots button { width: 7px; height: 7px; border-radius: 999px; background: rgba(255,255,255,.55); padding:0; }
.dots span.on,.dots button.on { width: 22px; background: var(--white); }

.detail-content { padding: 20px 20px 120px; }
.detail-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.detail-head h1 { font-family: var(--font-display); font-weight: 500; font-size: 26px; line-height: 1.2; }
.fav {
  width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
  background: var(--cream-deep); display: grid; place-items: center;
  transition: transform .15s ease, color .2s ease;
}
.fav:active { transform: scale(.94); }
.fav.active { color: var(--accent); }
.fav.active svg { fill: currentColor; }
.subtitle { margin-top: 6px; color: var(--muted); }
.price { margin-top: 8px; font-size: 20px; font-weight: 600; }

.meta { margin-top: 10px; display: flex; align-items: center; font-size: 12px; }
.meta-item { display: flex; align-items: center; gap: 4px; padding: 0 12px; }
.meta-item:first-child { padding-left: 0; }
.meta-item + .meta-item { border-left: 1px solid var(--line); }
.meta-item .lucide { width: 14px; height: 14px; color: var(--accent); }

.desc { margin-top: 12px; font-size: 13px; line-height: 1.6; color: var(--muted); }
.ingredients { margin-top: 20px; }
.ingredients h2 { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
.ingredient-list { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 4px; }
.ingredient {
  flex-shrink: 0; width: 56px; display: flex; flex-direction: column;
  align-items: center; gap: 6px; font-size: 11px; color: var(--muted); text-align: center;
}
.ingredient .img-box { width: 52px; height: 52px; border-radius: 50%; }

.bottom-bar {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 3;
  background: var(--cream); padding: 12px 20px calc(16px + var(--safe-bottom));
  display: flex; flex-direction: column; align-items: stretch; gap: 10px;
  box-shadow: 0 -6px 18px rgba(0,0,0,.04);
}
.order-row { display:flex; align-items:center; gap:16px; }
.stepper { display: flex; align-items: center; gap: 12px; }
.step-btn {
  width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid #CFC6BA;
  display: grid; place-items: center; transition: transform .15s ease;
}
.step-btn:active { transform: scale(.94); }
.step-btn .lucide { width: 16px; height: 16px; }
.qty { font-size: 16px; font-weight: 600; min-width: 16px; text-align: center; }
.add-btn {
  flex: 1; height: 56px; padding: 0 20px; border-radius: 999px;
  background: var(--olive); color: var(--white); font-size: 15px; font-weight: 600;
  display: flex; align-items: center; justify-content: space-between;
  transition: transform .15s ease, background .2s ease;
}
.ar-btn { width:100%; min-height:52px; border-radius:999px; display:flex; align-items:center; justify-content:center; gap:11px; background:var(--accent); color:#fff; font-weight:600; font-size:14px; }
.ar-btn:hover { background:var(--accent-hover); }
.ar-btn .lucide {width:20px;height:20px}
.view.detail .detail-content {padding-bottom:210px}
.ar-preview {position:relative; height:min(48dvh,400px); min-height:240px; background:#201d19; border-radius:18px; overflow:hidden; margin-top:12px; display:grid;place-items:center}
.ar-preview video {width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.ar-preview .ar-target {position:relative;z-index:2;color:white;border:1px dashed rgba(255,255,255,.75);width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font-size:40px;text-shadow:0 2px 15px #0009;pointer-events:none}
.ar-preview .ar-caption {position:absolute;bottom:12px;left:12px;right:12px;z-index:3;color:white;text-align:center;background:#1119;border-radius:12px;padding:10px;font-size:12px}

.add-btn:hover { background: var(--olive-hover); }
.add-btn:active { transform: scale(.97); }

/* Toast simples de confirmação */
.toast {
  position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%);
  background: var(--text); color: var(--white); font-size: 13px;
  padding: 10px 16px; border-radius: 999px; z-index: 10;
  opacity: 0; pointer-events: none; transition: opacity .25s ease;
}
.toast.show { opacity: 1; }
.sheet > * { max-width: 640px; margin-left: auto; margin-right: auto; }

.dots span,.dots button { cursor: pointer; transition: width .25s, background .25s; }
.ingredient .img-missing::after { font-size: 24px; }
.avatar.img-missing::after { font-size: 18px; }
.thumb.img-missing::after { font-size: 28px; }

.pop-panel { position: relative; width: 100%; max-width: 520px; max-height: 80%; overflow-y: auto; background: var(--cream); border-radius: var(--r-sheet) var(--r-sheet) 0 0; padding: 10px 20px calc(20px + var(--safe-bottom)); transform: translateY(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1); color: var(--text); }

/* Imagens via API (LoremFlickr, sem chave). Para fotos melhores, troque por Unsplash/Pexels com chave. Sem rede/permissão, aparece o emoji. */
function PHOTO(id, w = 900, h = 1000) { return 'https://images.unsplash.com/' + id + '?auto=format&fit=crop&w=' + w + '&h=' + h + '&q=82'; }
function IMG(q, w, h, n = 1) { return 'https://loremflickr.com/' + w + '/' + h + '/' + encodeURIComponent(q) + '?lock=' + n; }
const FOOD = { truffle: ['🍝', 'pasta,truffle'], steak: ['🥩', 'steak,beef'], caesar: ['🥗', 'caesar,salad'], lava: ['🍰', 'chocolate,cake'], salmon: ['🐟', 'salmon,fillet'] };
const foodOf = it => FOOD[it.id] || ['🍽️', 'food'];
const EMOJI = { Salmon: '🐟', Herbs: '🌿', Risotto: '🍚', Tomatoes: '🍅', Lemon: '🍋', Pasta: '🍝', Truffle: '🍄', Parmesan: '🧀', Cream: '🥛', Beef: '🥩', Garlic: '🧄', Potato: '🥔', Romaine: '🥬', Croutons: '🍞', Chocolate: '🍫', Butter: '🧈', Berries: '🍓' };
const galleryOf = it => it.gallery?.length ? it.gallery : [it.image || IMG(foodOf(it)[1], 800, 900, 1)];
const itemImg = (it, n = 1, w = 600, h = 700) => galleryOf(it)[n - 1] || galleryOf(it)[0];

/* ---------- Popups (bottom sheet) ---------- */
function openSheet(title, body, instant) {
  closeSheet();
  const el = document.createElement('div');
  el.className = 'pop';
  el.innerHTML = `<div class='pop-bg'></div><div class='pop-panel' role='dialog' aria-modal='true' aria-label='${title}'><div class='sheet-handle'></div><div class='pop-head'><h3>${title}</h3><button class='icon-btn' data-close aria-label='Fechar'>${icon('x')}</button></div>${body}</div>`;
  $app.appendChild(el);
  if (window.lucide) lucide.createIcons({ attrs: { 'stroke-width': 1.8 } });
  el.querySelector('.pop-bg').onclick = closeSheet;
  el.querySelector('[data-close]').onclick = closeSheet;
  if (instant) el.classList.add('open'); else requestAnimationFrame(() => el.classList.add('open'));
  el.querySelector('[data-close]').focus({preventScroll:true});
  return el;
}
let arStream = null;
function stopAR() { if (arStream) { arStream.getTracks().forEach(track => track.stop()); arStream = null; } }
function closeSheet() { stopAR(); const p = document.querySelector('.pop'); if (p) p.remove(); }
async function openAR(item) {
  const el = openSheet('Visualizar em AR', `<p class="ar-help">${item.name} · Prévia de câmera</p><div class="ar-preview"><video autoplay muted playsinline aria-label="Câmera traseira"></video><div class="ar-target">${foodOf(item)[0]}</div><div class="ar-caption" id="arStatus">Solicitando acesso à câmera…</div></div><p class="ar-help">Esta é uma prévia da câmera, não um objeto 3D ancorado. Para posicionar o prato sobre uma superfície em AR real, é necessário configurar o modelo GLB do produto e usar WebXR em dispositivo compatível.</p>`);
  const status = el.querySelector('#arStatus');
  if (!navigator.mediaDevices?.getUserMedia || !window.isSecureContext) {
    status.textContent = 'Câmera indisponível. Abra o site por HTTPS ou localhost e permita o acesso.';
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({video: {facingMode:{ideal:'environment'}}, audio:false});
    if (!el.isConnected) { stream.getTracks().forEach(t => t.stop()); return; }
    arStream = stream;
    el.querySelector('video').srcObject = stream;
    status.textContent = 'Câmera ativa · Modelo 3D ainda não configurado';
  } catch (err) { status.textContent = 'Não foi possível ativar a câmera. Verifique as permissões do navegador.'; }
}
function actionSheet(title, actions) {
  const el = openSheet(title, `<div>${actions.map((a, i) => `<button class='pop-item ${a.danger ? 'danger' : ''}' data-i='${i}'>${icon(a.icon)}<span>${a.label}</span>${a.hint ? `<em>${a.hint}</em>` : ''}</button>`).join('')}</div>`);
  el.querySelectorAll('[data-i]').forEach(b => b.onclick = () => { closeSheet(); actions[+b.dataset.i].fn(); });
}
function saveSession(){try{localStorage.setItem('savor-demo-state',JSON.stringify({order:state.order,favorites:[...state.favorites]}))}catch(e){}}
function recount() { state.cart = Object.values(state.order).reduce((a, b) => a + b, 0); updateCartBadge(); saveSession(); }
function clearCart() { if (!state.cart) return toast('O pedido já está vazio'); if (!confirm('Remover todos os itens do pedido?')) return; state.order = {}; recount(); toast('Pedido limpo'); }
function toggleFav(id) {
  if (state.favorites.has(id)) state.favorites.delete(id); else state.favorites.add(id);
  const f = document.getElementById('fav'); if (f) f.classList.toggle('active', state.favorites.has(id));
  saveSession(); toast(state.favorites.has(id) ? 'Adicionado aos favoritos' : 'Removido dos favoritos');
}
async function shareIt(text) {
  try { if (navigator.share) { await navigator.share({ title: CONFIG.restaurant.name, text }); return; } } catch (e) { return; }
  try { await navigator.clipboard.writeText(text); toast('Texto copiado'); } catch (e) { toast('Compartilhar indisponível aqui'); }
}
function sortItems() {
  state.sort = state.sort === 'asc' ? 'desc' : 'asc';
  CONFIG.items.sort((a, b) => state.sort === 'asc' ? a.price - b.price : b.price - a.price);
  lastRoute = null; route('#/menu'); toast('Cardápio reordenado');
}
function openFavs() {
  const favs = CONFIG.items.filter(i => state.favorites.has(i.id));
  const el = openSheet('Meus favoritos', favs.length ? favs.map(i => `<button class='pop-item' data-oid='${i.id}'><span style='font-size:24px'>${foodOf(i)[0]}</span><span>${i.name}</span><em>${fmt.format(i.price)}</em></button>`).join('') : `<p class='empty'>Nenhum favorito ainda.<br>Toque no coração dentro de um prato.</p>`);
  el.querySelectorAll('[data-oid]').forEach(b => b.onclick = () => { closeSheet(); go('#/item/' + b.dataset.oid); });
}
function openCart(instant) {
  const ent = Object.entries(state.order).filter(([, q]) => q > 0);
  const total = ent.reduce((s, [id, q]) => s + q * findItem(id).price, 0);
  const rows = ent.map(([id, q]) => { const it = findItem(id); return `<div class='cart-row'><span class='em'>${foodOf(it)[0]}</span><div class='info'><b>${it.name}</b><small>${fmt.format(it.price)}</small></div><div class='stepper'><button class='step-btn' data-q='${id}' data-d='-1'>${icon('minus')}</button><span class='qty'>${q}</span><button class='step-btn' data-q='${id}' data-d='1'>${icon('plus')}</button></div></div>`; }).join('');
  const el = openSheet('Meu pedido', rows ? `${rows}<div class='cart-total'><span>Total</span><b>${fmt.format(total)}</b></div><button class='add-btn' data-checkout style='width:100%;justify-content:center'>Finalizar pedido</button>` : `<p class='empty'>Seu pedido está vazio.<br>Toque em + nos pratos para adicionar.</p>`, instant === true);
  el.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { const id = b.dataset.q; state.order[id] = Math.max(0, (state.order[id] || 0) + +b.dataset.d); recount(); openCart(true); });
  const ck = el.querySelector('[data-checkout]');
  if (ck) ck.onclick = () => { closeSheet(); openSheet('Revisar pedido', `<p class='desc'>Esta é uma demonstração visual. Nenhum pedido será enviado a um restaurante.</p><div class='cart-total'><span>Total</span><b>${fmt.format(total)}</b></div><button class='add-btn' style='width:100%;justify-content:center' data-copy-order>Copiar resumo do pedido</button>`).querySelector('[data-copy-order]').onclick=()=>shareIt(ent.map(([id,q])=>q+'x '+findItem(id).name).join(', ')+ ' | Total: '+fmt.format(total)); };
}
function infoPopup(kind){ const content={booking:['Reservas','Agendamento demonstrativo: selecione uma data e um horário para visualizar sua preferência.','calendar-days'],offers:['Ofertas','No momento não há promoções cadastradas para este restaurante.','tag'],nearby:['Localização','A localização real do restaurante ainda não foi configurada nesta demonstração.','map-pin'],bell:['Notificações','Você está em dia. Não há novas notificações.','bell']};const [title,desc,ic]=content[kind];openSheet(title,`<div style='padding:20px 0;text-align:center'>${icon(ic)}<p class='desc' style='margin-top:12px'>${desc}</p></div>${kind==='booking'?`<label for='bookdate'>Data</label><input id='bookdate' type='date' min='${new Date().toISOString().slice(0,10)}' style='display:block;width:100%;padding:12px;margin:8px 0;border:1px solid var(--line);border-radius:12px'><label for='booktime'>Horário</label><input id='booktime' type='time' value='19:00' style='display:block;width:100%;padding:12px;margin:8px 0;border:1px solid var(--line);border-radius:12px'><button class='add-btn' style='width:100%;justify-content:center' data-book>Salvar preferência</button>`:''}`);const b=document.querySelector('[data-book]');if(b)b.onclick=()=>{const d=document.getElementById('bookdate').value,t=document.getElementById('booktime').value;if(!d)return toast('Selecione uma data');closeSheet();toast('Preferência anotada: '+d+' às '+t+' (demo)')};}

function imgBox(url, label, extraClass = '') {
  const missing = !url;
  return `
    <div class="img-box ${extraClass} ${missing ? 'img-missing' : ''}" data-label="${label}">
      ${missing ? '' : `<img src="${url}" alt="${label}" onerror="this.parentElement.classList.add('img-missing');this.remove()">`}
    </div>`;
}

function icon(name) { return `<i data-lucide="${name}"></i>`; }

function statusBar(color = 'var(--text)') { return ''; } // o navegador/celular já exibe a status bar

function findItem(id) { return CONFIG.items.find(i => i.id === id); }

function toast(msg) {
  let t = document.querySelector('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; $app.appendChild(t); }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 1600);
}

function addToCart(qty = 1, id) {
  state.cart += qty;
  if (id) state.order[id] = (state.order[id] || 0) + qty;

  const b = document.getElementById('cartCount');

let lastRoute = null;

function route(hash) {
  if (typeof hash !== 'string') hash = location.hash;
  hash = hash || '#/home';
  if (hash === lastRoute) return;
  lastRoute = hash;

  const [name, id] = hash.replace(/^#\/?/, '').split('/');
  state.currentId = id;

  if (name === 'menu') {
    render(viewMenu());
  } else if (name === 'item' && findItem(id)) {
    state.qty = 1;
    render(viewItem(findItem(id)));
  } else {
    render(viewHome()); // sem replaceState: em iframes srcdoc a URL não pode ser alterada
  }
  window.scrollTo(0, 0);
}

/* Navega: tenta atualizar o hash e renderiza direto, para funcionar mesmo se o histórico estiver bloqueado */
function go(hash) {
  try { location.hash = hash; } catch (e) { /* ambiente sem acesso ao histórico */ }
  route(hash);
}

/* =========================================================
   EVENTOS (delegação)
   ========================================================= */
function bindEvents() {
  // navegação
  $app.querySelectorAll('[data-nav]').forEach(el =>
    el.addEventListener('click', () => go(el.dataset.nav)));

  $app.querySelectorAll('[data-info]').forEach(el => el.addEventListener('click', () => infoPopup(el.dataset.info)));
  // toast em botões ainda não implementados
  $app.querySelectorAll('[data-toast]').forEach(el =>
    el.addEventListener('click', () => toast(el.dataset.toast)));

  // filtros de categoria (re-render só da lista, sem trocar de tela)
  $app.querySelectorAll('[data-filter]').forEach(el =>
    el.addEventListener('click', () => {
      state.filter = el.dataset.filter;
      $app.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === el));
      $app.querySelectorAll('.card').forEach(card => {
        const item = findItem(card.dataset.open);
        card.classList.toggle('hidden', !(state.filter === 'all' || item.category === state.filter));
      });
    }));

  // abrir produto ao tocar no card
  $app.querySelectorAll('[data-open]').forEach(el =>
    el.addEventListener('click', () => go(`#/item/${el.dataset.open}`)));

  // "+" do card: adiciona sem abrir o produto
  $app.querySelectorAll('[data-add]').forEach(el =>
    el.addEventListener('click', e => {
      e.stopPropagation();
      addToCart(1, el.dataset.add);
      toast(`${findItem(el.dataset.add).name} adicionado`);
    }));

  // favorito
  const fav = document.getElementById('fav');
  if (fav) fav.addEventListener('click', () => toggleFav(state.currentId));

  // popups "..." e carrinho
  $app.querySelectorAll('[data-cart]').forEach(b => b.onclick = () => openCart());
  $app.querySelectorAll('[data-more]').forEach(b => b.onclick = () => moreMenu(b.dataset.more));

  // slides do produto
  const sl = document.getElementById('slides');
  if (sl) {
    const dots = [...document.querySelectorAll('#dots button')];
    const idx = () => Math.round(sl.scrollLeft / sl.clientWidth);
    const goTo = i => sl.scrollTo({ left: Math.max(0, Math.min(dots.length - 1, i)) * sl.clientWidth, behavior: 'smooth' });
    sl.addEventListener('scroll', () => dots.forEach((d, k) => d.classList.toggle('on', k === idx())), { passive: true });
    dots.forEach(d => d.addEventListener('click', () => goTo(+d.dataset.dot)));
    $app.querySelectorAll('[data-slide]').forEach(b => b.addEventListener('click', () => goTo(idx() + +b.dataset.slide)));
  }

  // stepper + total
  const plus = document.getElementById('plus');
  if (plus) {
    const item = findItem(state.currentId);
    const qtyEl = document.getElementById('qty');
    const totalEl = document.getElementById('totalPrice');
    const refresh = () => {
      qtyEl.textContent = state.qty;
      totalEl.textContent = fmt.format(state.qty * item.price);
    };
    plus.addEventListener('click', () => { state.qty++; refresh(); });
    document.getElementById('minus').addEventListener('click', () => {
      if (state.qty > 1) { state.qty--; refresh(); }
    });
    document.getElementById('openAR').addEventListener('click', () => openAR(item));
    document.getElementById('addOrder').addEventListener('click', () => {
      addToCart(state.qty, state.currentId);
      toast(`${state.qty}x ${item.name} no pedido`);
    });
  }
}

/* Gestos horizontais simples para voltar (swipe da esquerda para a direita) */
let touchX = null;
$app.addEventListener('touchstart', e => { touchX = e.target.closest('.slides,.chips,.ingredient-list,.pop,button,input') ? null : e.touches[0].clientX; }, { passive: true });
$app.addEventListener('touchend', e => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (touchX < 32 && dx > 110 && lastRoute && lastRoute !== '#/home') { go(lastRoute.startsWith('#/item/') ? '#/menu' : '#/home'); }
  touchX = null;
});

/* =========================================================
   INIT
   ========================================================= */
try { const saved=JSON.parse(localStorage.getItem('savor-demo-state')||'{}'); if(saved.order && typeof saved.order==='object')state.order=Object.fromEntries(Object.entries(saved.order).filter(([id,q])=>findItem(id)&&Number.isInteger(q)&&q>0&&q<999)); if(Array.isArray(saved.favorites))state.favorites=new Set(saved.favorites.filter(id=>findItem(id)));state.cart=Object.values(state.order).reduce((a,b)=>a+b,0); }catch(e){}
window.addEventListener('hashchange', () => route());
document.addEventListener('DOMContentLoaded', () => route());
if (document.readyState !== 'loading') route();
</script>
</body>
</html>
