const clone=o=>JSON.parse(JSON.stringify(o));let data;try{data=JSON.parse(localStorage.getItem('savor_admin_demo_v4'))||clone(seed)}catch{data=clone(seed)};const state={page:'dashboard',q:'',filter:'Todos',sort:'Nome',modal:null};const root=document.getElementById('root');const money=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const ic=n=>`<i data-lucide="${esc(n)}" class="ico"></i>`;const save=()=>{try{localStorage.setItem('savor_admin_demo_v4',JSON.stringify(data))}catch{}};const product=id=>data.products.find(p=>p.id===id);const model=id=>data.models.find(m=>m.id===id);const isAvail=p=>p.active&&p.stock>0;const validImg=url=>url&&/^(https?:\/\/|data:image\/|blob:)/i.test(url);const imageOf=p=>validImg(p.image)?p.image:photos.pasta;const imageTag=(src,cls='thumb',alt='')=>`<img class="${cls}" src="${esc(src||photos.pasta)}" alt="${esc(alt)}" loading="lazy" onerror="this.src='${photos.pasta}'">`;function icons(){if(window.lucide){try{lucide.createIcons()}catch{}}}const nav=[['dashboard','layout-dashboard','Visão geral'],['products','utensils','Produtos'],['stock','package','Estoque'],['themes','palette','Temas do cardápio'],['reservations','calendar-days','Reservas'],['contacts','contact-round','Contatos'],['establishment','store','Estabelecimento'],['models','box','Catálogo 3D'],['preview','smartphone','Prévia pública'],['orders','clipboard-list','Pedidos'],['reports','chart-no-axes-combined','Relatórios']];const pageTitle={dashboard:'Painel do Estabelecimento',products:'Gestão de Produtos',stock:'Controle de Estoque',themes:'Temas do Cardápio',reservations:'Reservas e Contatos',contacts:'Contatos do Estabelecimento',establishment:'Dados do Estabelecimento',models:'Catálogo de Modelos 3D',preview:'Prévia do Cardápio',orders:'Pedidos',reports:'Relatórios'};const iconButton=(name,action,title)=>`<button class="btn icononly" data-act="${action}" aria-label="${esc(title)}" title="${esc(title)}">${ic(name)}</button>`;const smallBtn=(name,label,act,cls='')=>`<button class="btn slim ${cls}" data-act="${act}">${ic(name)}${esc(label)}</button>`;function go(pg){state.page=pg;state.q='';state.filter='Todos';render();window.scrollTo({top:0,behavior:'instant'})}function toast(message){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=message;document.body.appendChild(t);setTimeout(()=>t.remove(),2700)}function status(){return `<span class="statuspill ${data.published?'':'off'}">${data.published?'● Cardápio publicado':'Ⅱ Cardápio pausado'}</span>`}function shell(){root.innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><span class="logo">${ic('utensils-crossed')}</span><span><b>Savor Studio</b><small>Gestão gastronômica</small></span></div><div class="side-label">ESPAÇO DE TRABALHO</div>${nav.map(([id,icon,title],i)=>`${i===3||i===9?'<div class="side-label">'+(i===3?'CONFIGURAÇÕES':'OPERAÇÃO')+'</div>':''}<button class="navbtn ${state.page===id?'active':''}" data-page="${id}">${ic(icon)}${title}</button>`).join('')}<div class="sidebottom"><div class="avatar">BP</div><div><b>${esc(data.restaurant.name)}</b><small>Administrador · Demonstração</small></div></div></aside><main class="main"><div class="mobile-top"><div class="brand"><span class="logo">${ic('utensils-crossed')}</span><span><b>${esc(data.restaurant.name)}</b><small>Gerenciamento</small></span></div>${iconButton('bell','notifications','Notificações')}</div><div class="topline"><div><div class="eyebrow">SAVOR / PAINEL ADMINISTRATIVO</div><h1 class="page-title">${pageTitle[state.page]}</h1><p class="subtitle">${esc(data.restaurant.name)} · ${esc(data.restaurant.category)} &nbsp; ${status()}</p></div><div class="top-actions"><button class="btn primary" data-act="publish">${ic('upload')} Publicar</button><button class="btn outline" data-act="pause">${ic(data.published?'pause-circle':'play-circle')} ${data.published?'Pausar cardápio':'Retomar cardápio'}</button></div></div><div class="page" id="content">${page()}</div></main></div><nav class="bottomnav">${[['dashboard','house','Início'],['products','utensils','Produtos'],['models','box','Modelos 3D'],['reservations','calendar','Reservas'],['establishment','user-round','Conta']].map(([id,ico,label])=>`<button data-page="${id}" class="${state.page===id?'active':''}">${ic(ico)}${label}</button>`).join('')}</nav><div id="modalHost"></div>`;icons()}
function metric(label,val,icon,hint){return `<div class="panel metric"><div class="metric-top"><span>${esc(label)}</span>${ic(icon)}</div><b>${esc(val)}</b><small>${esc(hint)}</small></div>`}function section(title,button,pg){return `<div class="sectionhead"><h2>${title}</h2>${button?`<button data-page="${pg}">${button} ${ic('chevron-right')}</button>`:''}</div>`}function quickBtn(id,icon,label){return `<button class="quickbtn" data-page="${id}">${ic(icon)}<span>${esc(label)}</span></button>`}function chart(){const vals=[22,36,29,48,39,58,69],w=640,h=210,pad=33,min=0,max=80,coords=vals.map((v,i)=>[pad+i*(w-pad*2)/(vals.length-1),h-27-(v/max)*(h-65)]);const path=coords.map(([x,y],i)=>`${i?'L':'M'}${x},${y}`).join(' '),area=path+` L${coords.at(-1)[0]},${h-27} L${coords[0][0]},${h-27} Z`;return `<svg viewBox="0 0 640 210" class="chart" role="img" aria-label="Gráfico ilustrativo de interesse no cardápio durante sete dias"><defs><linearGradient id="areaGradient" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#94b46b" stop-opacity=".35"/><stop offset="100%" stop-color="#94b46b" stop-opacity="0"/></linearGradient></defs>${[0,20,40,60,80].map(v=>{let y=h-27-v/max*(h-65);return `<line class="chartgrid" x1="${pad}" x2="${w-8}" y1="${y}" y2="${y}"/><text class="chartlabel" x="3" y="${y+4}">${v}</text>`}).join('')}<path class="chartfill" d="${area}"/><path class="chartline" d="${path}"/>${coords.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="4" fill="#567846" stroke="#fff" stroke-width="2"/>`).join('')}${['Qua','Qui','Sex','Sáb','Dom','Seg','Ter'].map((t,i)=>`<text x="${coords[i][0]}" y="205" text-anchor="middle" class="chartlabel">${t}</text>`).join('')}</svg>`}
function dashboard(){const active=data.products.filter(isAvail).length,pending=data.reservations.filter(r=>r.status==='Pendente').length;return `<div class="grid g3">${metric('Produtos ativos',active,'salad','Disponíveis para clientes')}${metric('Reservas',data.reservations.length,'calendar-days',`${pending} aguardando confirmação`)}${metric('Modelos 3D',data.models.length,'box',`${data.models.filter(m=>m.active).length} habilitados`)}</div>${section('Gerenciar estabelecimento')}<div class="quick">${quickBtn('products','utensils','Produtos')}${quickBtn('themes','layers-2','Temas')}${quickBtn('reservations','calendar-days','Reservas')}${quickBtn('contacts','users-round','Contatos')}${quickBtn('establishment','store','Estabelecimento')}${quickBtn('models','box','Catálogo 3D')}${quickBtn('preview','eye','Prévia do cardápio')}${quickBtn('stock','package','Estoque')}</div>${section('Resumo e atividade','Ver relatórios','reports')}<div class="dashboard-main"><div class="panel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><b style="font-size:15px">Interesse pelo cardápio</b><p class="small muted" style="margin:5px 0">Últimos 7 dias · Dados ilustrativos</p></div><span class="statuspill">Visão semanal</span></div>${chart()}<p class="footnote">O gráfico apresenta dados fictícios de demonstração, não métricas reais de acessos.</p></div><div class="panel"><b style="font-size:15px">Atividade recente</b>${data.reservations.slice(0,3).map(r=>`<div class="feeditem"><span class="feedicon">${ic('calendar-check')}</span><div><b>${esc(r.name)}</b><small>Reserva ${esc(r.status.toLowerCase())} · ${esc(r.time)}</small></div></div>`).join('')}<div class="feeditem"><span class="feedicon">${ic('package-check')}</span><div><b>${data.products.length} produtos cadastrados</b><small>Confira o estoque e visibilidade</small></div></div></div></div>${section('Prévia rápida do cardápio','Abrir prévia','preview')}<div class="panel" style="display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap"><div><b>Seu cardápio em um clique</b><p class="small muted">Veja como seus clientes enxergam as opções.</p><button class="btn soft" data-page="preview">${ic('smartphone')} Visualizar cardápio</button></div><div class="previewstrip">${data.products.slice(0,4).map(p=>imageTag(imageOf(p),'','Prato')).join('')}</div></div>`}
function toolbar(placeholder,filters=[],add=''){return `<div class="toolbar"><label class="search">${ic('search')}<input id="listSearch" type="search" placeholder="${esc(placeholder)}" value="${esc(state.q)}" autocomplete="off"></label>${add?`<button class="btn primary" data-act="${add}">${ic('plus')} Adicionar</button>`:''}</div>${filters.length?`<div class="filter" id="filterChips" style="margin-bottom:16px">${filters.map(f=>`<button class="chip ${state.filter===f?'active':''}" data-filter="${esc(f)}">${esc(f)}</button>`).join('')}</div>`:''}`}
function productsPage(){return `${toolbar('Buscar por nome, categoria ou descrição...',['Todos','Ativos','Pausados','Sem estoque'],'new-product')}<div class="sectionhead"><h2><span id="listCount">${data.products.length}</span> produtos</h2><div class="compact-controls"><span class="tiny muted">Ordenar:</span><select id="sortSelect"><option ${state.sort==='Nome'?'selected':''}>Nome</option><option ${state.sort==='Menor preço'?'selected':''}>Menor preço</option><option ${state.sort==='Maior preço'?'selected':''}>Maior preço</option><option ${state.sort==='Estoque'?'selected':''}>Estoque</option></select></div></div><div id="listResults">${productsRows()}</div>`}
function productsRows(){let arr=data.products.filter(p=>(p.name+' '+p.category+' '+p.description).toLowerCase().includes(state.q.toLowerCase())&&(state.filter==='Todos'||(state.filter==='Ativos'&&isAvail(p))||(state.filter==='Pausados'&&!p.active&&p.stock>0)||(state.filter==='Sem estoque'&&p.stock<=0)));arr.sort((a,b)=>state.sort==='Menor preço'?a.price-b.price:state.sort==='Maior preço'?b.price-a.price:state.sort==='Estoque'?a.stock-b.stock:a.name.localeCompare(b.name,'pt-BR'));return arr.length?arr.map(p=>`<div class="listcard">${imageTag(imageOf(p),'thumb',p.name)}<div class="rowmain"><b>${esc(p.name)}</b><small>${esc(p.category)}</small><span class="money">${money(p.price)}</span></div><div class="rowactions"><span class="statuspill ${p.stock<=0?'off':!p.active?'warn':''}">${p.stock<=0?'Sem estoque':p.stock+' em estoque'}</span><button class="switch ${p.active?'on':''}" aria-label="${p.active?'Pausar':'Ativar'} produto ${esc(p.name)}" data-act="toggle-product:${p.id}" title="Ativar ou pausar"></button>${smallBtn('pencil','Editar','edit-product:'+p.id)}${smallBtn('trash-2','Apagar','delete-product:'+p.id,'danger')}</div></div>`).join(''):`<div class="empty">${ic('search-x')}<b>Nenhum produto encontrado</b><p>Revise a pesquisa ou o filtro selecionado.</p></div>`}
function stockPage(){let low=data.products.filter(p=>p.stock<=5).length;return `<div class="grid g3">${metric('Total de unidades',data.products.reduce((s,p)=>s+p.stock,0),'boxes','Estoque atual')}${metric('Produtos sem estoque',data.products.filter(p=>p.stock===0).length,'package-x','Pausam automaticamente a oferta')}${metric('Estoque baixo',low,'triangle-alert','Até 5 unidades')}</div>${section('Atualização de estoque')}${toolbar('Pesquisar estoque...',['Todos','Disponíveis','Baixo','Zerado'])}<div id="listResults">${stockRows()}</div>`}
function stockRows(){let arr=data.products.filter(p=>p.name.toLowerCase().includes(state.q.toLowerCase())&&(state.filter==='Todos'||(state.filter==='Disponíveis'&&p.stock>5)||(state.filter==='Baixo'&&p.stock>0&&p.stock<=5)||(state.filter==='Zerado'&&p.stock===0)));return arr.length?arr.map(p=>`<div class="listcard">${imageTag(imageOf(p),'thumb',p.name)}<div class="rowmain"><b>${esc(p.name)}</b><small>Saldo atual: <strong>${p.stock}</strong> unidades</small><span class="statuspill ${p.stock===0?'off':p.stock<=5?'warn':''}">${p.stock===0?'Sem estoque':p.stock<=5?'Estoque baixo':'Disponível'}</span></div><div class="rowactions"><button class="btn slim" data-act="stock:-1:${p.id}">${ic('minus')} -1</button><button class="btn slim" data-act="stock:1:${p.id}">${ic('plus')} +1</button>${smallBtn('pencil','Ajustar','edit-stock:'+p.id)}</div></div>`).join(''):`<div class="empty">Nenhum item neste filtro.</div>`}
function themesPage(){return `${section('Escolha um tema')}<div class="theme-grid">${[['classico','Clássico'],['minimal','Minimal'],['bistro','Bistrô'],['dark','Escuro']].map(([id,name])=>`<button class="theme-card ${id} ${data.theme.preset===id?'selected':''}" data-act="preset:${id}"><div class="theme-thumbnail"><i></i><i></i><i></i></div>${name} ${data.theme.preset===id?'✓':''}</button>`).join('')}</div>${section('Personalização do cardápio','Abrir prévia','preview')}<div class="theme-options"><div class="panel"><div class="formgrid"><div class="field"><label>Cor principal</label><input id="themeColor" type="color" value="${esc(data.theme.color)}"></div><div class="field"><label>Tipografia</label><select id="themeFont"><option ${data.theme.font==='DM Sans'?'selected':''}>DM Sans</option><option ${data.theme.font==='Manrope'?'selected':''}>Manrope</option><option ${data.theme.font==='Georgia'?'selected':''}>Georgia</option></select></div><div class="field"><label>Arredondamento</label><select id="themeRounded">${[['8','Discreto'],['20','Suave'],['32','Muito arredondado']].map(([v,t])=>`<option value="${v}" ${data.theme.rounded===v?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>Fundo do cardápio</label><select id="themeBackground">${['Claro','Bege','Escuro'].map(v=>`<option ${data.theme.background===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field full"><label>Imagem de destaque (URL)</label><input id="themeBanner" value="${esc(data.restaurant.banner)}" placeholder="https://..."></div></div><div class="switchrow"><div><strong>Tema personalizado ativo</strong><small>Aplicar ao cardápio de prévia</small></div><button class="switch ${data.theme.active?'on':''}" data-act="theme-active"></button></div><button class="btn primary" data-act="save-theme">${ic('save')} Salvar aparência</button></div><div class="panel"><b>Prévia rápida</b><div style="margin:14px 0">${previewPhone(true)}</div></div></div>`}
function previewPhone(compact=false){const bg=data.theme.active?data.theme.color:'#536545',p=data.products.filter(isAvail).slice(0,3);const rounded=Number(data.theme.rounded)||20;return `<div class="phone-preview" style="background:${data.theme.background==='Escuro'?'#202621':data.theme.background==='Bege'?'#f0e6d8':'#f8f6ef'};color:${data.theme.background==='Escuro'?'white':'#203022'};font-family:${esc(data.theme.font)},sans-serif;border-radius:${rounded+10}px"><div class="preview-hero" style="background-image:url('${esc(data.restaurant.banner||photos.hero)}');background-color:${bg}"><strong>${esc(data.restaurant.name)}</strong></div><div class="preview-body"><span class="tiny" style="color:${esc(bg)};font-weight:800">PRATOS DA CASA</span>${p.length?p.map(i=>`<div class="preview-row" style="border-radius:${rounded/2}px;color:#203022">${imageTag(imageOf(i),'',i.name)}<div><strong>${esc(i.name)}</strong><small>${money(i.price)}</small></div></div>`).join(''):'<div class="empty">Sem produtos disponíveis</div>'}${compact?'':`<button class="btn primary" style="background:${esc(bg)};width:100%;margin-top:12px" data-page="products">${ic('utensils')} Gerenciar itens</button>`}</div></div>`}
function reservationsPage(){return `<div class="grid g3">${metric('Reservas cadastradas',data.reservations.length,'calendar-days','Base demonstrativa')}${metric('Pendentes',data.reservations.filter(r=>r.status==='Pendente').length,'hourglass','Aguardam resposta')}${metric('Confirmadas',data.reservations.filter(r=>r.status==='Confirmada').length,'calendar-check','Mesas reservadas')}</div>${section('Gerenciar reservas')}${toolbar('Pesquisar cliente, data ou horário...',['Todos','Pendente','Confirmada','Cancelada'],'new-reservation')}<div id="listResults">${reservationRows()}</div>${section('Atalhos de contato','Gerenciar contatos','contacts')}<div class="panel"><div class="grid g2">${Object.entries(data.contacts).map(([k,v])=>`<div class="switchrow"><strong>${({whatsapp:'WhatsApp',instagram:'Instagram',phone:'Telefone',email:'E-mail'})[k]}</strong><button class="switch ${v?'on':''}" data-act="contact-toggle:${k}"></button></div>`).join('')}</div></div>`}
function reservationRows(){const rs=data.reservations.filter(r=>(r.name+' '+r.date+' '+r.time+' '+r.phone).toLowerCase().includes(state.q.toLowerCase())&&(state.filter==='Todos'||r.status===state.filter));return rs.length?rs.map(r=>`<div class="listcard reservation-card"><span class="feedicon">${ic('user-round')}</span><div class="details"><b>${esc(r.name)}</b><small>${esc(r.date)} · ${esc(r.time)} · ${r.people} pessoas</small></div><div class="compact-controls"><span class="statuspill ${r.status==='Cancelada'?'off':r.status==='Pendente'?'warn':''}">${r.status}</span>${r.status==='Pendente'?smallBtn('check','Confirmar','confirm-reservation:'+r.id,'soft'):''}${smallBtn('eye','Detalhes','edit-reservation:'+r.id)}</div></div>`).join(''):`<div class="empty">Nenhuma reserva encontrada.</div>`}
function contactsPage(){return `<div class="panel" style="max-width:850px"><p class="small muted">Controle quais canais serão exibidos para clientes na página pública. Os dados podem ser editados em “Estabelecimento”.</p>${[['whatsapp','message-circle','WhatsApp','Receber mensagens e solicitações'],['instagram','instagram','Instagram','Exibir perfil social'],['phone','phone','Telefone','Disponibilizar ligação'],['email','mail','E-mail','Exibir contato profissional']].map(([k,i,name,desc])=>`<div class="switchrow"><div style="display:flex;align-items:center;gap:12px"><span class="feedicon">${ic(i)}</span><div><strong>${name}</strong><small>${desc}</small></div></div><button class="switch ${data.contacts[k]?'on':''}" aria-label="Alternar ${name}" data-act="contact-toggle:${k}"></button></div>`).join('')}<div class="formactions"><button class="btn soft" data-page="establishment">${ic('pencil')} Editar informações</button><button class="btn" data-page="preview">${ic('eye')} Ver prévia</button></div></div>`}
function establishmentPage(){const r=data.restaurant;return `<form id="estForm" class="panel" style="max-width:950px"><div class="formgrid"><div class="field"><label>Nome do estabelecimento</label><input name="name" value="${esc(r.name)}" required></div><div class="field"><label>Categoria</label><input name="category" value="${esc(r.category)}"></div><div class="field full"><label>Descrição</label><textarea name="description">${esc(r.description)}</textarea></div><div class="field full"><label>Endereço público</label><input name="address" value="${esc(r.address)}"></div><div class="field"><label>WhatsApp (DDD + número)</label><input name="whatsapp" value="${esc(r.whatsapp)}"></div><div class="field"><label>Instagram</label><input name="instagram" value="${esc(r.instagram)}"></div><div class="field"><label>Telefone</label><input name="phone" value="${esc(r.phone)}"></div><div class="field"><label>E-mail</label><input name="email" type="email" value="${esc(r.email)}"></div><div class="field full"><label>Horário de funcionamento</label><input name="hours" value="${esc(r.hours)}"></div><div class="field full"><label>URL da imagem da capa</label><input name="banner" value="${esc(r.banner)}"></div></div><div class="grid g2" style="margin-top:14px"><div class="switchrow"><div><strong>Estabelecimento visível</strong><small>Mostrar dados e perfil na prévia</small></div><button type="button" class="switch ${r.visible?'on':''}" data-act="restaurant-visible"></button></div><div class="switchrow"><div><strong>Contatos públicos</strong><small>Exibir canais habilitados</small></div><button type="button" class="switch ${r.contactsVisible?'on':''}" data-act="restaurant-contacts"></button></div></div><div class="formactions"><button class="btn primary" type="submit">${ic('save')} Salvar estabelecimento</button></div></form>${section('Modelos associados','Gerenciar modelos','models')}<div class="panel">${data.models.slice(0,3).map(m=>`<div class="feeditem"><span class="feedicon">${ic('box')}</span><div style="flex:1"><b>${esc(m.name)}</b><small>${esc(product(m.product)?.name||'Sem produto vinculado')}</small></div>${smallBtn('eye','Ver','view-model:'+m.id)}</div>`).join('')}</div>`}
function modelsPage(){return `<div class="grid g3">${metric('Modelos cadastrados',data.models.length,'box','Associação por produto')}${metric('Modelos ativos',data.models.filter(m=>m.active).length,'scan','Habilitados para AR')}${metric('Itens sem modelo',data.products.filter(p=>!data.models.some(m=>m.product===p.id)).length,'package-x','Aguardam GLB')}</div>${section('Biblioteca de modelos')}${toolbar('Buscar modelo, produto ou arquivo GLB...',['Todos','Ativos','Pausados','Sem vínculo'],'new-model')}<div id="listResults">${modelRows()}</div><p class="footnote">O catálogo guarda referências de arquivos .glb/.gltf. A prévia 3D real exige hospedar esses arquivos e integrar um visualizador WebGL/WebXR no projeto final.</p>`}
function modelRows(){const arr=data.models.filter(m=>(m.name+' '+(product(m.product)?.name||'')+' '+m.url).toLowerCase().includes(state.q.toLowerCase())&&(state.filter==='Todos'||(state.filter==='Ativos'&&m.active)||(state.filter==='Pausados'&&!m.active)||(state.filter==='Sem vínculo'&&!m.product)));return arr.length?arr.map(m=>{let p=product(m.product);return `<div class="listcard">${imageTag(p?imageOf(p):photos.pasta,'thumb',m.name)}<div class="rowmain"><b>${esc(m.name)}</b><small>${esc(p?.name||'Sem produto vinculado')} · ${esc(m.size||'Tamanho não informado')}</small><small class="breakable">${esc(m.url)}</small></div><div class="rowactions"><span class="statuspill ${m.active?'':'warn'}">${m.active?'Ativo':'Pausado'}</span>${smallBtn('eye','Ver','view-model:'+m.id)}${smallBtn('pencil','Editar','edit-model:'+m.id)}${smallBtn('trash-2','Excluir','delete-model:'+m.id,'danger')}<button class="ar-btn" data-act="view-model:${m.id}">${ic('scan')} AR</button></div></div>`}).join(''):`<div class="empty">Nenhum modelo encontrado.</div>`}
function previewPage(){return `<div class="grid g2"><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:13px"><b>Visão do cliente</b>${status()}</div>${previewPhone()}<p class="footnote">Simulação visual para revisar publicação, temas e produtos. O projeto final pode usar estes dados para alimentar o cardápio público.</p></div><div class="panel"><h2 style="font-size:18px;margin-top:0">Informações públicas</h2><p class="small muted">${esc(data.restaurant.description)}</p><div class="feeditem"><span class="feedicon">${ic('map-pin')}</span><div><b>Endereço</b><small>${esc(data.restaurant.address)}</small></div></div><div class="feeditem"><span class="feedicon">${ic('clock')}</span><div><b>Funcionamento</b><small>${esc(data.restaurant.hours)}</small></div></div><div class="feeditem"><span class="feedicon">${ic('eye')}</span><div><b>Visibilidade</b><small>${data.restaurant.visible?'Informações visíveis':'Estabelecimento oculto'}</small></div></div>${data.restaurant.contactsVisible?Object.keys(data.contacts).filter(k=>data.contacts[k]).map(k=>`<div class="feeditem"><span class="feedicon">${ic(k==='email'?'mail':k==='instagram'?'instagram':'phone')}</span><div><b>${esc(k)}</b><small>${esc(data.restaurant[k])}</small></div></div>`).join(''):''}<div class="formactions" style="justify-content:start"><button class="btn soft" data-page="themes">${ic('palette')} Personalizar tema</button><button class="btn" data-page="products">${ic('pencil')} Editar produtos</button></div></div></div>`}
function ordersPage(){return `${section('Acompanhamento de pedidos')}${toolbar('Buscar por cliente ou número...',['Todos','Novo','Em preparo','Concluído'])}<div id="listResults">${orderRows()}</div><p class="footnote">Pedidos de exemplo para testar o fluxo. Esta interface não está conectada a um checkout real.</p>`}function orderRows(){let arr=data.orders.filter(o=>(o.customer+' '+o.id+' '+o.items).toLowerCase().includes(state.q.toLowerCase())&&(state.filter==='Todos'||o.status===state.filter));return arr.length?arr.map(o=>`<div class="listcard"><span class="feedicon">${ic('receipt')}</span><div class="rowmain"><b>${esc(o.id)} · ${esc(o.customer)}</b><small>${esc(o.items)} · ${esc(o.time)}</small><span class="money">${money(o.total)}</span></div><div class="rowactions"><span class="statuspill ${o.status==='Novo'?'warn':''}">${esc(o.status)}</span>${smallBtn('arrow-right','Avançar','order-next:'+o.id)}</div></div>`).join(''):'<div class="empty">Nenhum pedido encontrado.</div>'}
function reportsPage(){return `<div class="grid g3">${metric('Produtos',data.products.length,'utensils','Cadastrados')}${metric('Reservas',data.reservations.length,'calendar-check','Total de registros')}${metric('Estoque',data.products.reduce((s,p)=>s+p.stock,0),'boxes','Unidades')}</div>${section('Indicadores demonstrativos')}<div class="panel"><b>Interesse semanal</b>${chart()}<p class="footnote">Série ilustrativa para referência de interface. Não é um relatório financeiro ou contador de visitas real.</p></div>${section('Distribuição por categoria')}<div class="panel"><div class="grid g2">${[...new Set(data.products.map(p=>p.category))].map(cat=>{let count=data.products.filter(p=>p.category===cat).length;return `<div><div class="small" style="display:flex;justify-content:space-between"><b>${esc(cat)}</b><b>${count}</b></div><div style="height:9px;border-radius:9px;background:#e6e9de;margin:8px 0 14px;overflow:hidden"><div style="height:100%;width:${count/Math.max(1,data.products.length)*100}%;background:#718b52;border-radius:9px"></div></div></div>`}).join('')}</div></div>`}
function page(){return ({dashboard,products:productsPage,stock:stockPage,themes:themesPage,reservations:reservationsPage,contacts:contactsPage,establishment:establishmentPage,models:modelsPage,preview:previewPage,orders:ordersPage,reports:reportsPage}[state.page]||dashboard)()}
function modal(title,body){const host=document.getElementById('modalHost');host.innerHTML=`<div class="modalback"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modalhead"><h2>${esc(title)}</h2><button class="modalclose" data-act="close-modal" aria-label="Fechar">${ic('x')}</button></div><div class="modalbody">${body}</div></div></div>`;icons();host.querySelector('.modalback').addEventListener('click',e=>{if(e.target.classList.contains('modalback'))closeModal()})}function closeModal(){document.getElementById('modalHost').innerHTML=''}
function productModal(id){let p=id?product(id):null;const fields=`<form id="productForm" data-id="${p?.id||''}"><div class="formgrid"><div class="field"><label>Nome do produto *</label><input name="name" value="${esc(p?.name||'')}" required></div><div class="field"><label>Categoria *</label><input name="category" value="${esc(p?.category||'')}" list="categoryHints" required><datalist id="categoryHints">${[...new Set(data.products.map(p=>p.category))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div><div class="field"><label>Preço (R$) *</label><input name="price" type="number" min="0" step="0.01" value="${p?.price??0}" required></div><div class="field"><label>Quantidade no estoque</label><input name="stock" type="number" min="0" step="1" value="${p?.stock??0}" required></div><div class="field full"><label>URL da imagem do prato</label><input name="image" type="text" value="${esc(p?.image||'')}" placeholder="https://..."></div><div class="field full"><label>Descrição</label><textarea name="description">${esc(p?.description||'')}</textarea></div><div class="field"><label>Modelo 3D associado</label><select name="model"><option value="">Sem modelo</option>${data.models.map(m=>`<option value="${m.id}" ${p?.model===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div><div class="field"><label>Status</label><select name="active"><option value="true" ${p?.active!==false?'selected':''}>Ativo</option><option value="false" ${p?.active===false?'selected':''}>Pausado</option></select></div></div><div class="formactions"><button type="button" class="btn" data-act="close-modal">Cancelar</button><button class="btn primary" type="submit">${ic('save')} Salvar produto</button></div></form>`;modal(p?'Editar produto':'Novo produto',fields)}
function modelModal(id){const m=id?model(id):null;modal(m?'Editar modelo 3D':'Novo modelo 3D',`<form id="modelForm" data-id="${m?.id||''}"><div class="formgrid"><div class="field"><label>Nome do modelo</label><input name="name" value="${esc(m?.name||'')}" required></div><div class="field"><label>Produto relacionado</label><select name="product"><option value="">Sem vínculo</option>${data.products.map(p=>`<option value="${p.id}" ${m?.product===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field full"><label>URL/caminho do arquivo .glb / .gltf</label><input name="url" value="${esc(m?.url||'')}" placeholder="https://seusite.com/models/prato.glb" required></div><div class="field"><label>Tamanho informativo</label><input name="size" value="${esc(m?.size||'')}" placeholder="8 MB"></div><div class="field"><label>Status</label><select name="active"><option value="true" ${m?.active!==false?'selected':''}>Ativo</option><option value="false" ${m?.active===false?'selected':''}>Pausado</option></select></div></div><p class="help">Nesta demonstração, o arquivo é associado por URL/caminho. Um upload de GLB requer armazenamento configurado no projeto final.</p><div class="formactions"><button type="button" class="btn" data-act="close-modal">Cancelar</button><button class="btn primary" type="submit">${ic('save')} Salvar modelo</button></div></form>`)}
function reservationModal(id){const r=id?data.reservations.find(r=>r.id===id):null;modal(r?'Editar reserva':'Nova reserva',`<form id="reservationForm" data-id="${r?.id||''}"><div class="formgrid"><div class="field"><label>Nome do cliente</label><input name="name" value="${esc(r?.name||'')}" required></div><div class="field"><label>Telefone</label><input name="phone" value="${esc(r?.phone||'')}"></div><div class="field"><label>Data</label><input name="date" type="date" value="${r?.date||'2026-11-10'}" required></div><div class="field"><label>Horário</label><input name="time" type="time" value="${r?.time||'19:00'}" required></div><div class="field"><label>Pessoas</label><input name="people" type="number" min="1" value="${r?.people||2}" required></div><div class="field"><label>Status</label><select name="status">${['Pendente','Confirmada','Cancelada'].map(v=>`<option ${r?.status===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field full"><label>Observações</label><textarea name="notes">${esc(r?.notes||'')}</textarea></div></div><div class="formactions">${r?`<button type="button" class="btn danger" data-act="delete-reservation:${r.id}">${ic('trash-2')} Excluir</button>`:''}<button class="btn primary" type="submit">${ic('save')} Salvar reserva</button></div></form>`)}
function confirmDelete(type,id){const name=type==='product'?product(id)?.name:type==='model'?model(id)?.name:data.reservations.find(r=>r.id===id)?.name;modal('Confirmar exclusão',`<p>Deseja realmente excluir <strong>${esc(name)}</strong>? Esta ação afeta apenas os dados da demonstração salvos neste navegador.</p><div class="formactions"><button class="btn" data-act="close-modal">Cancelar</button><button class="btn danger" data-act="really-delete:${type}:${id}">${ic('trash-2')} Excluir</button></div>`)}
function viewModel(id){let m=model(id),p=product(m.product);modal('Catálogo 3D · '+m.name,`<div class="model-scene">${ic('box')}</div><h3>${esc(m.name)}</h3><p class="small muted">Produto: ${esc(p?.name||'Não vinculado')}<br>Arquivo: <span class="breakable">${esc(m.url)}</span><br>Status: ${m.active?'Ativo':'Pausado'}</p><div class="formactions"><button class="btn" data-act="edit-model:${m.id}">${ic('pencil')} Editar</button><button class="btn soft" data-act="open-model:${m.id}">${ic('external-link')} Abrir arquivo</button></div>`)}
function act(action){const [kind,id,third]=action.split(':');if(kind==='close-modal')return closeModal();if(kind==='notifications')return modal('Notificações',`<p class="small muted">${data.reservations.filter(r=>r.status==='Pendente').length} reservas pendentes de confirmação.</p><button class="btn primary" data-page="reservations">${ic('calendar-days')} Ver reservas</button>`);if(kind==='publish'){data.published=true;save();render();return toast('Cardápio marcado como publicado nesta demonstração')}if(kind==='pause'){data.published=!data.published;save();render();return toast(data.published?'Cardápio retomado':'Cardápio pausado')}if(kind==='new-product')return productModal();if(kind==='edit-product')return productModal(id);if(kind==='delete-product')return confirmDelete('product',id);if(kind==='toggle-product'){product(id).active=!product(id).active;save();renderList();return toast('Visibilidade do produto atualizada')}if(kind==='edit-stock'){const p=product(id);modal('Ajustar estoque · '+p.name,`<form id="stockForm" data-id="${id}"><div class="field"><label>Quantidade disponível</label><input type="number" name="stock" min="0" value="${p.stock}" required></div><div class="formactions"><button class="btn primary" type="submit">Salvar estoque</button></div></form>`);return}if(kind==='stock'){let p=product(third);p.stock=Math.max(0,p.stock+Number(id));save();renderList();return}if(kind==='new-model')return modelModal();if(kind==='edit-model')return modelModal(id);if(kind==='delete-model')return confirmDelete('model',id);if(kind==='view-model')return viewModel(id);if(kind==='open-model'){let m=model(id);if(/^https?:\/\//.test(m.url))window.open(m.url,'_blank','noopener,noreferrer');else toast('Caminho local ilustrativo: hospede o arquivo para abri-lo');return}if(kind==='new-reservation')return reservationModal();if(kind==='edit-reservation')return reservationModal(id);if(kind==='delete-reservation')return confirmDelete('reservation',id);if(kind==='confirm-reservation'){data.reservations.find(r=>r.id===id).status='Confirmada';save();renderList();return toast('Reserva confirmada')}if(kind==='contact-toggle'){data.contacts[id]=!data.contacts[id];save();render();return}if(kind==='restaurant-visible'){data.restaurant.visible=!data.restaurant.visible;save();render();return}if(kind==='restaurant-contacts'){data.restaurant.contactsVisible=!data.restaurant.contactsVisible;save();render();return}if(kind==='theme-active'){data.theme.active=!data.theme.active;save();render();return}if(kind==='preset'){data.theme.preset=id;data.theme.color=({classico:'#405f39',minimal:'#a08b6b',bistro:'#825536',dark:'#25372d'})[id];data.theme.background=id==='dark'?'Escuro':id==='bistro'?'Bege':'Claro';save();render();return toast('Tema selecionado; revise e salve a aparência')}if(kind==='save-theme'){data.theme.color=document.querySelector('#themeColor').value;data.theme.font=document.querySelector('#themeFont').value;data.theme.rounded=document.querySelector('#themeRounded').value;data.theme.background=document.querySelector('#themeBackground').value;data.restaurant.banner=document.querySelector('#themeBanner').value;save();render();return toast('Aparência salva')}if(kind==='order-next'){let o=data.orders.find(x=>x.id===id);o.status=o.status==='Novo'?'Em preparo':o.status==='Em preparo'?'Concluído':'Concluído';save();renderList();return toast('Pedido atualizado')}if(kind==='really-delete'){if(id==='product'){data.products=data.products.filter(p=>p.id!==third);data.models.forEach(m=>{if(m.product===third)m.product=''})}else if(id==='model'){data.models=data.models.filter(m=>m.id!==third);data.products.forEach(p=>{if(p.model===third)p.model=''})}else data.reservations=data.reservations.filter(r=>r.id!==third);save();closeModal();render();toast('Registro excluído')} }
function renderList(){const holder=document.getElementById('listResults');if(!holder){render();return}holder.innerHTML=({products:productsRows,stock:stockRows,reservations:reservationRows,models:modelRows,orders:orderRows}[state.page]||(()=>''))();const count=document.getElementById('listCount');if(count)count.textContent=holder.querySelectorAll('.listcard').length;icons()}
function render(){shell()}
document.addEventListener('click',e=>{let target=e.target.closest('[data-act],[data-page],[data-filter]');if(!target)return;if(target.dataset.page){closeModal();go(target.dataset.page);return}if(target.dataset.filter){state.filter=target.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x.dataset.filter===state.filter));renderList();return}if(target.dataset.act){act(target.dataset.act)}});document.addEventListener('input',e=>{if(e.target.id==='listSearch'){state.q=e.target.value;renderList()}});document.addEventListener('change',e=>{if(e.target.id==='sortSelect'){state.sort=e.target.value;renderList()}});document.addEventListener('submit',e=>{if(!['productForm','modelForm','reservationForm','estForm','stockForm'].includes(e.target.id))return;e.preventDefault();const f=e.target,raw=Object.fromEntries(new FormData(f));if(f.id==='productForm'){const id=f.dataset.id||'p'+Date.now(),obj={id,name:raw.name.trim(),category:raw.category.trim(),price:Math.max(0,Number(raw.price)),stock:Math.max(0,Math.floor(Number(raw.stock))),active:raw.active==='true',image:raw.image.trim(),description:raw.description.trim(),model:raw.model};const index=data.products.findIndex(p=>p.id===id);if(index>=0)data.products[index]=obj;else data.products.push(obj);data.models.forEach(m=>{if(m.product===id&&m.id!==obj.model)m.product=''});if(obj.model){let m=model(obj.model);if(m)m.product=id}closeModal();toast('Produto salvo')}if(f.id==='modelForm'){const id=f.dataset.id||'m'+Date.now();if(!/\.(glb|gltf)(\?.*)?$/i.test(raw.url)){toast('Informe o caminho ou URL de um arquivo .glb ou .gltf');return}const obj={id,name:raw.name.trim(),product:raw.product,url:raw.url.trim(),size:raw.size,active:raw.active==='true'};const index=data.models.findIndex(m=>m.id===id);if(index>=0)data.models[index]=obj;else data.models.push(obj);data.products.forEach(p=>{if(p.model===id&&p.id!==obj.product)p.model=''});if(obj.product){const p=product(obj.product);if(p)p.model=id}closeModal();toast('Modelo salvo')}if(f.id==='reservationForm'){const id=f.dataset.id||'r'+Date.now(),obj={id,name:raw.name.trim(),phone:raw.phone,date:raw.date,time:raw.time,people:Math.max(1,Number(raw.people)),status:raw.status,notes:raw.notes};const idx=data.reservations.findIndex(r=>r.id===id);if(idx<0)data.reservations.push(obj);else data.reservations[idx]=obj;closeModal();toast('Reserva salva')}if(f.id==='estForm'){Object.assign(data.restaurant,raw);toast('Dados do estabelecimento salvos')}if(f.id==='stockForm'){product(f.dataset.id).stock=Math.max(0,Math.floor(Number(raw.stock)));closeModal();toast('Estoque salvo')}save();render()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});window.addEventListener('load',icons);render();
</script></body></html>
