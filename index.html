<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f5ef" />
  <title>Mezzira — Experiências gastronômicas em 3D e AR</title>
  <style>
    /* O preloader nasce no HTML, antes do React e dos estilos do aplicativo. */
    html, body { margin: 0; min-height: 100%; background: #f7f5ef; }
    #mezzira-preload {
      position: fixed; inset: 0; z-index: 2147483647;
      min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      background: #f7f5ef; color: #2d4633; box-sizing: border-box;
      padding: 24px; font-family: system-ui, -apple-system, sans-serif;
      opacity: 1; visibility: visible; transition: opacity .38s ease, visibility .38s ease;
    }
    #mezzira-preload.mezzira-loaded { opacity: 0; visibility: hidden; pointer-events: none; }
    .mezzira-preload-content { text-align: center; width: min(100%, 340px); }
    .mezzira-preload-icon {
      position: relative; width: 76px; height: 76px; margin: 0 auto 23px;
      display: grid; place-items: center; border-radius: 25px;
      background: #e7eddb; border: 1px solid #d4dec8;
      box-shadow: 0 12px 26px rgba(46, 67, 42, .06);
    }
    .mezzira-preload-icon svg { width: 40px; height: 40px; fill: none; stroke: #415e3f; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .mezzira-preload-title { display: block; font-size: clamp(27px, 6vw, 34px); font-weight: 800; letter-spacing: .16em; line-height: 1.13; }
    .mezzira-preload-subtitle { margin: 9px 0 25px; font-size: 11px; font-weight: 700; letter-spacing: .35em; color: #7b8e75; }
    .mezzira-preload-track { width: 118px; height: 3px; border-radius: 8px; margin: 0 auto; overflow: hidden; background: #dce4d3; }
    .mezzira-preload-track span { display: block; width: 42%; height: 100%; background: #637b55; border-radius: inherit; animation: mezzira-loading 1.1s ease-in-out infinite alternate; }
    .mezzira-preload-label { margin: 15px 0 0; font-size: 12px; color: #82917c; }
    .mezzira-preload-retry { display: none; margin: 18px auto 0; background: #405f42; color: white; padding: 10px 16px; border-radius: 99px; border: 0; font: 600 12px system-ui, sans-serif; cursor: pointer; }
    #mezzira-preload.mezzira-slow .mezzira-preload-retry { display: inline-block; }
    @keyframes mezzira-loading { from { transform: translateX(-105%); } to { transform: translateX(255%); } }
    @media (prefers-reduced-motion: reduce) { .mezzira-preload-track span { animation: none; width: 100%; } #mezzira-preload { transition-duration: .01ms; } }
  </style>
</head>
<body>
  <div id="mezzira-preload" role="status" aria-live="polite" aria-label="Carregando Mezzira Cardápio">
    <div class="mezzira-preload-content">
      <div class="mezzira-preload-icon" aria-hidden="true">
        <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="16"/><circle cx="24" cy="24" r="10"/><path d="M7 9v10m-3-8h6m31-3v32M16 24c2-5 6-8 8-8"/></svg>
      </div>
      <strong class="mezzira-preload-title">MEZZIRA</strong>
      <p class="mezzira-preload-subtitle">CARDÁPIO</p>
      <div class="mezzira-preload-track" aria-hidden="true"><span></span></div>
      <p id="mezzira-preload-label" class="mezzira-preload-label">Preparando sua experiência…</p>
      <button class="mezzira-preload-retry" type="button" onclick="location.reload()">Tentar novamente</button>
    </div>
  </div>
  <div id="root"></div>
  <script>
    (function () {
      var startedAt = Date.now();
      var completed = false;
      var splash = document.getElementById('mezzira-preload');
      function finish() {
        if (completed) return;
        completed = true;
        window.setTimeout(function () {
          splash.classList.add('mezzira-loaded');
          window.setTimeout(function () { splash.remove(); }, 450);
        }, Math.max(0, 550 - (Date.now() - startedAt)));
      }
      window.addEventListener('mezzira:ready', finish, { once: true });
      window.setTimeout(function () {
        if (!completed) {
          splash.classList.add('mezzira-slow');
          document.getElementById('mezzira-preload-label').textContent = 'O carregamento está demorando. Confira sua conexão.';
        }
      }, 12000);
    })();
  </script>
  <script type="module" src="/src/platform.jsx"></script>
</body>
</html>
